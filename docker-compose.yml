services:
  postgres:
    image: postgres:16-alpine
    container_name: drontest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drontest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drontest_dev}
      POSTGRES_DB: ${POSTGRES_DB:-drontest}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drontest}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
